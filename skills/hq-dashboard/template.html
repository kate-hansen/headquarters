<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* Layout: a header with the generated time, then three stacked panels — projects, PRs awaiting review,
     today's Beads — each a titled list divided by rules. One reading column, chips carry state. */
  :root {
    --bg: #f5f6f8; --fg: #1b1f27; --muted: #5d6573; --rule: #d9dde4; --surface: #eaedf2;
    --accent: #2f56c4; --good: #2b7a3d; --warn: #9a5b00; --warn-bg: #fbefd9; --bad: #b3261e; --bad-bg: #fbe3e1;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --fg: #e4e7ec; --muted: #9aa2b0; --rule: #2c323c; --surface: #1d2229;
      --accent: #8eaaff; --good: #6fcf86; --warn: #f0b45a; --warn-bg: #3a2c12; --bad: #f28b82; --bad-bg: #3b1d1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --fg: #e4e7ec; --muted: #9aa2b0; --rule: #2c323c; --surface: #1d2229;
    --accent: #8eaaff; --good: #6fcf86; --warn: #f0b45a; --warn-bg: #3a2c12; --bad: #f28b82; --bad-bg: #3b1d1b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); padding-inline: 16px; }
  main { max-width: 820px; margin: 0 auto; padding-block: 28px 80px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  code { font-family: var(--font-mono); font-size: 13px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 4.5vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  p { margin: 0; }

  header { display: flex; gap: 12px 20px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .gen { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  button.theme { background: none; border: 1px solid var(--rule); color: var(--muted); font: inherit; font-size: 13px; border-radius: 999px; padding: 2px 12px; cursor: pointer; }

  section { border-top: 1px solid var(--rule); margin-top: 26px; padding-top: 18px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .sec-head { display: flex; gap: 10px; align-items: baseline; }
  .count { font-family: var(--font-mono); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  li .main { flex: 1 1 18ch; min-width: 0; }
  li .title { overflow-wrap: anywhere; }
  li .sub { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }

  .chip { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; border-radius: 999px; padding: 1px 9px; white-space: nowrap; background: var(--surface); color: var(--muted); }
  .chip.accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.num { font-family: var(--font-mono); font-weight: 500; }

  @media print {
    button.theme { display: none; }
    section, li { break-inside: avoid; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="label">Headquarters</p>
      <h1>Dashboard</h1>
    </div>
    <div style="display:flex; gap:12px; align-items:baseline;">
      <span class="gen" data-k="generated"></span>
      <button class="theme" type="button" aria-label="Toggle light and dark">theme</button>
    </div>
  </header>

  <section id="projects">
    <div class="sec-head"><h2>Your projects</h2><span class="count" data-count></span></div>
    <ul></ul>
  </section>

  <section id="prs">
    <div class="sec-head"><h2>Awaiting your review</h2><span class="count" data-count></span></div>
    <ul></ul>
  </section>

  <section id="monday">
    <div class="sec-head"><h2>Monday — your open items</h2><span class="count" data-count></span></div>
    <ul></ul>
  </section>

  <section id="beads">
    <div class="sec-head"><h2>Today in Beads</h2><span class="count" data-count></span></div>
    <ul></ul>
  </section>
</main>

<script type="application/json" id="dashboard-data">
{
  "generated": "2026-10-05 14:30",
  "projects": [
    { "slug": "recraft", "title": "ReCraft", "path": "/Users/katehansen/.headquarters/recraft/project.md", "openStories": 2, "note": "RTI participant view in review" }
  ],
  "prs": [
    { "repo": "ce-software/recraft", "number": 3340, "title": "Participant RTI module row and coursework drawer", "url": "https://github.com/ce-software/recraft/pull/3340", "age": "2d" }
  ],
  "monday": [
    { "board": "Tracker", "title": "C3 — Participant View: Coursework sheet", "url": "https://craft860026.monday.com/boards/18420290753/pulses/13106063662", "status": "In Progress", "age": "3d" },
    { "board": "Stories", "title": "Canvas LMS MVP: Mobile UI experience", "url": "https://craft860026.monday.com/boards/9975998815/pulses/12042011857", "status": "Blocked", "age": "3mo" }
  ],
  "beads": [
    { "id": "recraft-fb7", "title": "Swap RTI fake data for the real endpoints once stream A/B land", "status": "open", "priority": "p1", "type": "task", "repo": "recraft" },
    { "id": "recraft-a12", "title": "Hours conversion before epic close", "status": "in_progress", "priority": "p0", "type": "task", "repo": "recraft" }
  ]
}
</script>
<script>
  (function () {
    var data = {};
    try { data = JSON.parse(document.getElementById("dashboard-data").textContent); } catch (e) { data = {}; }

    var gen = document.querySelector('[data-k="generated"]');
    if (gen) gen.textContent = data.generated || "";

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function chip(text, kind) { return el("span", "chip" + (kind ? " " + kind : ""), text); }

    function priorityChip(priority) {
      if (priority === null || priority === undefined || priority === "") return null;
      var normalized = String(priority).toLowerCase().replace(/^p/, "");
      var kind = normalized === "0" ? "bad" : normalized === "1" ? "warn" : "";
      var label = /^\d+$/.test(normalized) ? "P" + normalized : String(priority).toUpperCase();
      return chip(label, kind);
    }

    function statusChip(status) {
      if (!status) return null;
      var normalized = String(status).toLowerCase();
      var kind = normalized === "blocked" ? "bad" : normalized.indexOf("progress") >= 0 ? "accent" : "";
      return chip(normalized.replace(/_/g, " "), kind);
    }

    function vscodeLink(path) { return "vscode://file/" + String(path).replace(/^\//, ""); }

    function fill(sectionId, items, renderRow) {
      var section = document.getElementById(sectionId);
      var list = section.querySelector("ul");
      var count = section.querySelector("[data-count]");
      count.textContent = items && items.length ? items.length : "";
      if (!items || !items.length) {
        list.appendChild(el("li", "empty", "Nothing here."));
        return;
      }
      items.forEach(function (item) { list.appendChild(renderRow(item)); });
    }

    fill("projects", data.projects, function (project) {
      var li = el("li");
      var main = el("div", "main");
      var link = el("a", "title", project.title || project.slug);
      link.href = vscodeLink(project.path || "");
      main.appendChild(link);
      if (project.note) main.appendChild(el("div", "sub", project.note));
      li.appendChild(main);
      var open = Number(project.openStories) || 0;
      li.appendChild(chip(open + (open === 1 ? " story" : " stories"), "num"));
      return li;
    });

    fill("prs", data.prs, function (pr) {
      var li = el("li");
      var main = el("div", "main");
      var link = el("a", "title", pr.title || ("#" + pr.number));
      link.href = pr.url || "#";
      main.appendChild(link);
      main.appendChild(el("div", "sub", (pr.repo || "") + " #" + pr.number));
      li.appendChild(main);
      if (pr.age) li.appendChild(chip(pr.age + " old", "num"));
      return li;
    });

    fill("monday", data.monday, function (item) {
      var li = el("li");
      var main = el("div", "main");
      var link = el("a", "title", item.title || "(untitled)");
      link.href = item.url || "#";
      main.appendChild(link);
      if (item.board) main.appendChild(el("div", "sub", item.board));
      li.appendChild(main);
      var stat = statusChip(item.status);
      if (stat) li.appendChild(stat);
      if (item.age) li.appendChild(chip(item.age, "num"));
      return li;
    });

    fill("beads", data.beads, function (bead) {
      var li = el("li");
      var main = el("div", "main");
      main.appendChild(el("div", "title", bead.title || bead.id));
      main.appendChild(el("div", "sub", bead.id + (bead.type ? " · " + bead.type : "")));
      li.appendChild(main);
      var pri = priorityChip(bead.priority);
      if (pri) li.appendChild(pri);
      var stat = statusChip(bead.status);
      if (stat) li.appendChild(stat);
      return li;
    });

    var toggle = document.querySelector("button.theme");
    if (toggle) toggle.addEventListener("click", function () {
      var dark = getComputedStyle(document.body).backgroundColor === "rgb(20, 23, 28)";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    });
  })();
</script>
</body>
</html>
