<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d1f1b; --muted: #62655e; --border: #dfddd5;
    --accent: #2f6fde; --heading: #2d4a22; --good: #2e7d32; --warn: #b26a00;
    --code-bg: #f3f2ee; --lineno: #a3a59d; --tag-before: #ece7dc; --tag-before-text: #5b5448;
    --tag-after: #e1ecd6; --tag-after-text: #2d4a22; --callout: #c9a227;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --surface: #1e201d; --text: #e7e8e3; --muted: #9da097; --border: #34372f;
      --accent: #7aa7ff; --heading: #b9dc8f; --good: #6fcf7a; --warn: #f0b45a;
      --code-bg: #252722; --lineno: #6b6e66; --tag-before: #37332b; --tag-before-text: #d4cbb8;
      --tag-after: #2a3a22; --tag-after-text: #b9dc8f; --callout: #c9a227;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 72px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre { font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
  h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; margin: 0 0 6px; color: var(--heading); }
  h2 { font-size: 20px; line-height: 1.3; margin: 0; color: var(--heading); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  p { margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .checked-how { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .summary { font-size: 16.5px; margin: 16px 0 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 21px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .kpi .from { color: var(--muted); font-weight: 500; font-size: 14px; }
  .kpi .delta { font-size: 13px; color: var(--good); font-weight: 600; }
  nav.toc { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; margin: 18px 0 4px; }
  section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin: 16px 0; }
  section.card.reviewed { opacity: .6; }
  .sec-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  label.check { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; cursor: pointer; }
  label.check input { accent-color: var(--good); }
  .pair { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; margin: 12px 0 4px; }
  figure { margin: 0; min-width: 0; flex: 1 1 280px; max-width: 480px; }
  figure.wide { max-width: none; flex-basis: 100%; }
  figcaption { font-size: 13.5px; color: var(--muted); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  figure img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; }
  .tag.before { background: var(--tag-before); color: var(--tag-before-text); }
  .tag.after { background: var(--tag-after); color: var(--tag-after-text); }
  ul.points { list-style: none; margin: 0; padding: 0; }
  ul.points li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  ul.points li:last-child { border-bottom: 0; }
  ul.points .text { flex: 1; }
  ul.points .where { flex: 0 1 auto; text-align: right; overflow-wrap: anywhere; font-size: 13px; }
  .snippet { margin-top: 10px; border-radius: 8px; background: var(--code-bg); overflow: hidden; }
  .snippet .head { font-size: 12.5px; padding: 6px 12px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .snippet pre { margin: 0; padding: 8px 0; overflow-x: auto; }
  .snippet .ln { display: block; padding: 0 12px; white-space: pre; }
  .snippet .ln::before { content: attr(data-n); display: inline-block; width: 3.2em; color: var(--lineno); user-select: none; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 13px; }
  .badge { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .badge.ok { color: var(--good); } .badge.issue { color: var(--warn); }
  ul.findings { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin: 5px 0; }
  .callout { border-left: 4px solid var(--callout); }
  .commit { position: relative; }
  .commit pre { margin: 0; white-space: pre-wrap; background: var(--code-bg); border-radius: 8px; padding: 12px 14px; }
  button.copy { position: absolute; top: 8px; right: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .progress { color: var(--muted); font-size: 13px; }
  @media print {
    body { background: #fff; } section.card { break-inside: avoid; }
    nav.toc, label.check, button.copy { display: none; }
  }
</style>
</head>
<body>
<main id="app"></main>

<!--
  The review skill replaces the JSON below with the report's data.
  Inside this block, write "</" as "<\/" so the script tag can't close early.
-->
<script type="application/json" id="report-data">
{
  "title": "Example: drag to reorder inventory slots",
  "project": "example-project",
  "story": { "id": "EX-004", "title": "Reorder inventory slots", "path": "C:/src/example/project/stories/in-progress/EX-004-reorder-inventory-slots.md" },
  "repo": "C:/src/example",
  "datetime": "2026-10-01 14:30",
  "branch": "feat/EX-004-reorder-inventory-slots",
  "scope": "Uncommitted changes against HEAD (a1b2c3d)",
  "checkedHow": "Edit-mode tests in Unity 6, plus manual drags in the Play-mode inventory scene at 1920 × 1080.",
  "summary": "Slots can now be dragged to reorder. Drag state moved into the grid, which owns the layout, so slots only raise events.",
  "kpis": [ { "label": "Inventory tests", "value": "12 passing", "from": "9", "delta": "+3 for reorder" } ],
  "lookClosely": [ { "text": "Drop index math when dragging past the last slot.", "path": "C:/src/example/src/InventoryGrid.cs", "line": 71 } ],
  "sections": [
    {
      "title": "Drag a slot to reorder it",
      "body": "Dragging a slot now lifts it and shows a gap where it will land. The grid owns the drag, because it already knows every slot's position; slots only report that a drag started or ended.",
      "images": [
        { "src": "assets/before.png", "caption": "Slots fixed in place", "tag": "before" },
        { "src": "assets/after.png", "caption": "Gap opens under the dragged slot", "tag": "after" }
      ],
      "points": [
        { "text": "The grid handles drag and drop for every slot", "path": "C:/src/example/src/InventoryGrid.cs", "line": 42, "endLine": 88 },
        { "text": "Slots raise events instead of moving themselves", "path": "C:/src/example/src/Slot.cs", "line": 15 }
      ],
      "snippet": { "path": "C:/src/example/src/Slot.cs", "line": 15, "code": "public event Action<int> DragStarted;\npublic event Action<int> Dropped;" },
      "tests": [ { "text": "Dropping past the last slot appends", "path": "C:/src/example/tests/InventoryGridTests.cs", "line": 30 } ],
      "review": { "standards": "ok", "spec": "ok", "findings": [] }
    }
  ],
  "sideChanges": [ { "text": "Fixed slot indices starting at 1 in the debug overlay.", "path": "C:/src/example/src/DebugOverlay.cs", "line": 30 } ],
  "decisions": [ { "text": "We chose events over a shared drag manager because only the grid consumes them.", "links": [] } ],
  "verified": ["Edit-mode tests pass (12/12)", "Manual drag across all 20 slots"],
  "caveats": ["Touch drag not checked: no touch device in the editor."],
  "alsoChanged": [ { "path": "C:/src/example/project/stories/in-progress/EX-004-reorder-inventory-slots.md", "note": "Added a Work History row and one open question" } ],
  "commitMessage": "feat(EX-004): drag to reorder inventory slots\n\nMove drag state into InventoryGrid; slots raise DragStarted/Dropped."
}
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var app = document.getElementById("app");
  var storeKey = "review:" + (data.project || "") + ":" + (data.story && data.story.id || "") + ":" + (data.datetime || "");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function add(node) { if (node) app.appendChild(node); }
  function norm(p) { return String(p || "").replace(/\\/g, "/"); }
  function relPath(p) {
    var path = norm(p), repo = norm(data.repo).replace(/\/$/, "");
    if (repo && path.toLowerCase().indexOf(repo.toLowerCase() + "/") === 0) return path.slice(repo.length + 1);
    return path;
  }
  function shortName(p) { return relPath(p).split("/").pop(); }
  function vscodeLink(path, line, endLine, label) {
    var href = "vscode://file/" + norm(path).replace(/^\//, "") + (line ? ":" + line : "");
    var text = label || (shortName(path) + (line ? ":" + line + (endLine ? "-" + endLine : "") : ""));
    return el("a", { href: href, title: relPath(path) + (line ? ":" + line : "") }, [el("code", { text: text })]);
  }
  function loadChecks() { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { return {}; } }
  function saveChecks(c) { try { localStorage.setItem(storeKey, JSON.stringify(c)); } catch (e) {} }
  function list(items, render, cls) {
    if (!items || !items.length) return null;
    return el("ul", { class: cls || "plain" }, items.map(function (i) { return el("li", null, render(i)); }));
  }
  function linked(text, path, line, endLine) {
    return [el("span", { class: "text", text: text || "" }), path ? el("span", { class: "where" }, [vscodeLink(path, line, endLine)]) : null];
  }
  function card(id, title, body, extraClass) {
    if (!body) return null;
    return el("section", { class: "card" + (extraClass ? " " + extraClass : ""), id: id }, [el("h2", { text: title }), el("div", { style: "margin-top:10px" }, [body])]);
  }

  document.title = "Review: " + (data.title || "");
  var sections = data.sections || [];

  // Header: title, meta, provenance, summary, KPIs, navigation
  var story = data.story || {};
  var meta = el("div", { class: "meta" }, [
    story.id ? (story.path ? vscodeLink(story.path, null, null, story.id + " " + (story.title || "")) : el("span", { text: story.id })) : null,
    data.branch ? el("span", null, [el("code", { text: data.branch })]) : null,
    data.datetime ? el("span", { text: data.datetime }) : null,
    data.scope ? el("span", { text: data.scope }) : null
  ]);
  var kpis = (data.kpis || []).length ? el("div", { class: "kpis" }, data.kpis.map(function (k) {
    return el("div", { class: "kpi" }, [
      el("div", { class: "label", text: k.label || "" }),
      el("div", { class: "value" }, [k.value || "", k.from ? el("span", { class: "from", text: " from " + k.from }) : null]),
      k.delta ? el("div", { class: "delta", text: k.delta }) : null
    ]);
  })) : null;
  var progress = el("span", { class: "progress" });
  var navItems = sections.map(function (s, i) { return el("a", { href: "#s" + (i + 1), text: (i + 1) + ". " + (s.title || "Change") }); });
  add(el("header", null, [
    el("h1", { text: data.title || "Review" }), meta,
    data.checkedHow ? el("div", { class: "checked-how", text: "How this was checked: " + data.checkedHow }) : null,
    data.summary ? el("p", { class: "summary", text: data.summary }) : null,
    kpis,
    sections.length ? el("nav", { class: "toc", "aria-label": "Sections" }, navItems.concat([progress])) : null
  ]));

  add(card("look", "Look closely at", list(data.lookClosely, function (l) { return linked(l.text, l.path, l.line, l.endLine); }, "points"), "callout"));

  // Sections: behaviour first, every claim linked to the code
  var checks = loadChecks();
  function updateProgress() {
    var n = sections.filter(function (_, i) { return checks[i]; }).length;
    progress.textContent = sections.length ? "· " + n + " of " + sections.length + " reviewed" : "";
  }
  sections.forEach(function (s, i) {
    var box = el("input", { type: "checkbox" });
    box.checked = !!checks[i];
    var node = el("section", { class: "card" + (box.checked ? " reviewed" : ""), id: "s" + (i + 1) });
    box.addEventListener("change", function () {
      checks[i] = box.checked; saveChecks(checks); updateProgress();
      node.classList.toggle("reviewed", box.checked);
    });
    node.appendChild(el("div", { class: "sec-head" }, [el("h2", { text: (i + 1) + ". " + (s.title || "Change") }), el("label", { class: "check" }, [box, "Reviewed"])]));
    if (s.body) node.appendChild(el("p", { text: s.body }));

    if ((s.images || []).length) {
      node.appendChild(el("div", { class: "pair" }, s.images.map(function (img) {
        return el("figure", { class: img.wide ? "wide" : "" }, [
          el("figcaption", null, [img.tag ? el("span", { class: "tag " + img.tag, text: img.tag }) : null, img.caption || ""]),
          el("a", { href: img.src, target: "_blank" }, [el("img", { src: img.src, alt: img.caption || "", loading: "lazy" })])
        ]);
      })));
    }

    if ((s.points || []).length) {
      node.appendChild(el("h3", { text: "How it's built" }));
      node.appendChild(list(s.points, function (p) { return linked(p.text, p.path, p.line, p.endLine); }, "points"));
    }

    if (s.snippet && s.snippet.code) {
      var start = s.snippet.line || 1;
      var pre = el("pre");
      String(s.snippet.code).split("\n").forEach(function (line, j) {
        pre.appendChild(el("span", { class: "ln", "data-n": String(start + j), text: line || " " }));
      });
      node.appendChild(el("div", { class: "snippet" }, [
        el("div", { class: "head" }, [s.snippet.path ? vscodeLink(s.snippet.path, start) : null]), pre
      ]));
    }

    if ((s.tests || []).length) {
      node.appendChild(el("h3", { text: "Proven by" }));
      node.appendChild(list(s.tests, function (t) { return linked(t.text, t.path, t.line); }, "points"));
    }

    if (s.review) {
      var r = s.review, findings = r.findings || [];
      var badge = function (name, v) { return v ? el("span", { class: "badge " + (v === "ok" ? "ok" : "issue"), text: name + (v === "ok" ? " ✓" : " · " + v) }) : null; };
      node.appendChild(el("div", { class: "badges" }, [badge("Standards", r.standards), badge("Spec", r.spec)]));
      if (findings.length) node.appendChild(list(findings, function (f) {
        return [f.text || "", f.path ? " " : null, f.path ? vscodeLink(f.path, f.line) : null];
      }, "findings"));
    }
    app.appendChild(node);
  });
  updateProgress();

  add(card("side", "Outside the slice's goal", list(data.sideChanges, function (c) { return linked(c.text, c.path, c.line, c.endLine); }, "points")));
  add(card("decisions", "Decisions", list(data.decisions, function (d) {
    return [d.text || ""].concat((d.links || []).map(function (l) { return el("span", null, [" ", el("a", { href: l.href, text: l.label || l.href })]); }));
  })));
  add(card("verified", "Verified by", list(data.verified, function (t) { return ["✓ ", t]; })));
  add(card("caveats", "Caveats", list(data.caveats, function (t) { return [t]; }), "callout"));
  add(card("also", "Also changed", list(data.alsoChanged, function (a) { return linked(a.note, a.path); }, "points")));

  if (data.commitMessage) {
    var msg = el("pre", { text: data.commitMessage });
    var btn = el("button", { class: "copy", type: "button", text: "Copy" });
    btn.addEventListener("click", function () {
      var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); };
      var fallback = function () {
        var range = document.createRange(); range.selectNodeContents(msg);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        try { document.execCommand("copy"); done(); } catch (e) {}
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data.commitMessage).then(done, fallback);
      else fallback();
    });
    add(card("commit", "Suggested commit message", el("div", { class: "commit" }, [msg, btn])));
  }
})();
</script>
</body>
</html>
